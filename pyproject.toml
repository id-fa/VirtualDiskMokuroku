[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "virtualdiskmokuroku"
version = "0.1.0"
description = "Everything (es.exe) 連携のオフライン ファイルリスト カタログツール"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
context = [
    "Pillow",
    "mutagen",
    "charset-normalizer",
    "olefile",
    "py7zr",
    "rarfile",
    "pycdlib",
]
dev = ["pytest", "pytest-qt"]

[project.scripts]
virtualdiskmokuroku = "virtualdiskmokuroku.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/virtualdiskmokuroku"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
